# Synthetic DEMO data (rendered locally). NOT a benchmark. Hyper-parameters of the baselines were set once on the
# synthetic train sequences.
data:
  dataset: synthetic
  det_source: public        # the generator writes a detector-like det.txt
  embedder: colorhist
  det_min_score: 0.1
results_dir: results/demo
rca:
  model_path: models/params/rca_synthetic.json
  fit_block: 40
fusion:
  fixed_lambda: 0.5
  app_gate: 0.6
  fused_cost_thresh: 0.75
stress:
  window: 40               # demo sequences are 160 frames long; real datasets use 100
